<style>
/* Layout: one-phone party app; a single centered column of big tap targets, a card stage in the middle, controls pinned to the thumb zone. Deliberately single dark theme: a soju-bottle green tent at night. */
:root {
  color-scheme: dark;
  --bg: #0c231c;
  --bg-2: #123329;
  --surface: #f3efe2;
  --surface-ink: #1b1a16;
  --fg: #eaf3ee;
  --muted: #93b3a6;
  --line: #24493c;
  --accent: #ff6a3d;
  --accent-ink: #2a0d03;
  --mint: #7fe0bf;
  --gold: #ffcf5a;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% -10%, #1a4a3a 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, label:focus-within { outline: 3px solid var(--gold); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.bar h2 { font-size: 22px; flex: 1; min-width: 0; }
.back { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--line); font-size: 20px; display: grid; place-items: center; flex: none; }
.pill { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* home */
.brand { padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.brand .eyebrow { color: var(--mint); font-size: 13px; letter-spacing: .14em; font-weight: 700; }
.brand h1 { font-size: clamp(44px, 14vw, 64px); line-height: 1; }
.brand h1 span { color: var(--accent); }
.brand p { color: var(--muted); margin: 4px 0 0; }
.games { display: grid; gap: 14px; }
.game {
  text-align: left; padding: 22px 20px; border-radius: 22px;
  display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6px 12px;
  transition: transform .15s ease;
}
.game:active { transform: scale(.98); }
.game h3 { font-size: 30px; grid-column: 1; }
.game p { margin: 0; grid-column: 1; font-size: 14px; opacity: .8; }
.game .glyph { grid-column: 2; grid-row: 1 / span 2; font-family: var(--display); font-size: 56px; line-height: 1; opacity: .9; }
.game.cards { background: var(--surface); color: var(--surface-ink); }
.game.quiz { background: var(--accent); color: var(--accent-ink); }
.notice { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 14px; margin-top: auto; }

/* deck chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2);
  font-size: 14px; font-weight: 500; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--mint); color: #062118; border-color: var(--mint); font-weight: 700; }

/* card stage */
.stage { perspective: 1200px; flex: 1; display: flex; min-height: 340px; }
.card {
  position: relative; width: 100%; min-height: 340px; flex: 1;
  transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.8,.2,1);
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 26px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; padding: 24px 22px;
}
.face.front {
  background:
    repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,.04) 14px 28px),
    var(--bg-2);
  border: 2px solid var(--line);
  align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.face.front .big { font-family: var(--display); font-size: 64px; color: var(--accent); line-height: 1; }
.face.front .hint { color: var(--muted); font-size: 14px; }
.face.rear { background: var(--surface); color: var(--surface-ink); transform: rotateY(180deg); gap: 14px; overflow-y: auto; }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 5px 10px; border-radius: 8px; background: var(--surface-ink); color: var(--surface); }
.qtext { font-size: clamp(22px, 6.4vw, 28px); font-weight: 900; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
.vs { display: grid; gap: 10px; flex: 1; align-content: center; }
.vs div { background: #e4ddc8; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 19px; word-break: keep-all; }
.vs b { justify-self: center; font-family: var(--display); color: var(--accent); font-size: 22px; font-weight: 400; }
.rule { font-size: 13px; color: #5d5a4e; border-top: 1px dashed #c9c1aa; padding-top: 10px; }

/* buttons */
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  min-height: 56px; border-radius: 16px; font-weight: 700; font-size: 17px; padding: 0 16px;
  background: var(--bg-2); border: 1px solid var(--line);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.mint { background: var(--mint); color: #062118; border-color: var(--mint); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 44px; font-size: 15px; }

/* quiz */
.quizbox { background: var(--surface); color: var(--surface-ink); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.quizhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.timer { position: relative; width: 64px; height: 64px; flex: none; }
.timer svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.timer .t { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.timer.hurry .t { color: var(--accent); }
.hints { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hints li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: #e4ddc8; border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 17px; word-break: keep-all; animation: pop .35s ease; }
.hints li span { font-family: var(--display); color: var(--accent); font-weight: 400; font-size: 18px; }
.hints li.locked { background: transparent; border: 2px dashed #c9c1aa; color: #8c8672; font-weight: 500; animation: none; }
.photo { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 1 / 1; max-width: 100%; max-height: 42vh; background: #d6cfb8; flex: none; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .6s ease, transform .6s ease; }
.answer { text-align: center; padding: 10px 0 4px; animation: pop .4s ease; }
.answer small { display: block; color: #6b6656; font-size: 13px; }
.answer strong { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 11vw, 46px); color: var(--surface-ink); line-height: 1.2; word-break: keep-all; }
.penalty { background: var(--surface-ink); color: var(--gold); border-radius: 14px; padding: 12px 14px; font-weight: 700; text-align: center; }
@keyframes pop { from { transform: scale(.94); opacity: .3; } to { transform: none; opacity: 1; } }

/* setup / edit */
.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 14px; }
.panel h3 { font-size: 20px; }
.panel p { margin: 0; color: var(--muted); font-size: 14px; }
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
input[type=text], textarea, select {
  width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
textarea { resize: vertical; min-height: 72px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { min-height: 48px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--mint); color: #062118; border-color: var(--mint); }
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.item img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; }
.item .txt { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.item .txt b { display: block; font-size: 15px; }
.item .x { width: 36px; height: 36px; border-radius: 10px; color: var(--muted); font-size: 18px; flex: none; }
.upload { display: flex; align-items: center; gap: 12px; padding: 12px; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer; color: var(--muted); font-size: 14px; }
.upload img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
.upload input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--mint); color: #062118; font-weight: 700; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; animation: pop .25s ease; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

/* ---------- storage (optional) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
let customQs = store.get("hp_customQs", []);       // [{deck, text, a, b}]
customQs.forEach(q => { if (!DECKS[q.deck]) q.deck = "truth"; });
let customPeople = store.get("hp_people", []);     // [{name, hints:[], photo}]

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* 안드로이드 뒤로가기 버튼: 앱이 꺼지지 않고 이전 화면으로 */
function enterSub() { try { if (!history.state) history.pushState({ sub: 1 }, ""); } catch (e) {} }
window.addEventListener("popstate", () => { const b = document.getElementById("back"); if (b) b.click(); });

/* 게임 중 화면이 꺼지지 않게 */
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
document.addEventListener("pointerdown", keepAwake, { once: true });

/* ---------- question cards ---------- */
let cardState = { decks: new Set(["balance", "pick", "truth", "mission"]), pile: [], idx: 0 };
function buildPile() {
  const all = [];
  for (const k of cardState.decks) {
    DECKS[k].items.forEach(it => all.push({ deck: k, it }));
    customQs.filter(q => q.deck === k).forEach(q => all.push({ deck: k, it: k === "balance" ? [q.a, q.b] : q.text, custom: true }));
  }
  cardState.pile = shuffle(all); cardState.idx = 0;
}
function cardsView() {
  stopTimer(); enterSub();
  buildPile();
  $app.innerHTML = `
    <div class="bar"><button class="back" id="back" aria-label="처음으로">←</button><h2>질문 카드</h2><span class="pill" id="count"></span></div>
    <div class="chips" id="chips">${Object.entries(DECKS).map(([k, d]) => `<button class="chip" data-k="${k}" aria-pressed="${cardState.decks.has(k)}">${d.name}</button>`).join("")}</div>
    <div class="stage"><div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="face front"><div class="big">?</div><div class="hint">탭해서 카드 뒤집기</div></div>
      <div class="face rear" id="back-face"></div>
    </div></div>
    <div class="row">
      <button class="btn" id="prev">이전</button>
      <button class="btn primary" id="next">다음 카드</button>
    </div>
    <button class="btn ghost small" id="addQ">+ 우리만의 질문 추가</button>`;
  document.getElementById("back").onclick = home;
  document.getElementById("chips").onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const k = b.dataset.k;
    if (cardState.decks.has(k)) { if (cardState.decks.size === 1) { toast("최소 한 종류는 골라야 해요"); return; } cardState.decks.delete(k); }
    else cardState.decks.add(k);
    b.setAttribute("aria-pressed", cardState.decks.has(k));
    buildPile(); renderCard(false);
  };
  const card = document.getElementById("card");
  const flip = () => { card.classList.toggle("flipped"); buzz(15); };
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  document.getElementById("next").onclick = () => { if (!card.classList.contains("flipped")) { flip(); return; } cardState.idx = (cardState.idx + 1) % cardState.pile.length; if (cardState.idx === 0) { cardState.pile = shuffle(cardState.pile); toast("카드를 다시 섞었어요"); } renderCard(true); };
  document.getElementById("prev").onclick = () => { cardState.idx = (cardState.idx - 1 + cardState.pile.length) % cardState.pile.length; renderCard(true); };
  document.getElementById("addQ").onclick = addQuestionView;
  renderCard(false);
}
function renderCard(animate) {
  const card = document.getElementById("card");
  const c = cardState.pile[cardState.idx];
  const d = DECKS[c.deck];
  const fill = () => {
    document.getElementById("back-face").innerHTML = `
      <span class="tag">${esc(d.name)}${c.custom ? " · 우리 질문" : ""}</span>
      ${c.deck === "balance"
        ? `<div class="vs"><div>A. ${esc(c.it[0])}</div><b>VS</b><div>B. ${esc(c.it[1])}</div></div>`
        : `<div class="qtext">${esc(c.it)}</div>`}
      <div class="rule">${esc(d.rule)}</div>`;
    document.getElementById("count").textContent = `${cardState.idx + 1} / ${cardState.pile.length}`;
  };
  if (animate && card.classList.contains("flipped")) {
    card.classList.remove("flipped");
    setTimeout(() => { fill(); card.classList.add("flipped"); }, 280);
  } else { fill(); if (animate) card.classList.add("flipped"); }
}
function addQuestionView() {
  enterSub();
  let deck = "pick";
  const draw = () => {
    $app.innerHTML = `
      <div class="bar"><button class="back" id="back" aria-label="질문 카드로">←</button><h2>우리만의 질문</h2></div>
      <form class="panel" id="f">
        <label class="f">종류
          <select id="deckSel">${Object.entries(DECKS).map(([k, d]) => `<option value="${k}" ${k === deck ? "selected" : ""}>${d.name}</option>`).join("")}</select>
        </label>
        ${deck === "balance"
          ? `<label class="f">A 선택지<input type="text" id="qa" maxlength="60" placeholder="예: 평생 떡볶이 금지" required></label>
             <label class="f">B 선택지<input type="text" id="qb" maxlength="60" placeholder="예: 평생 피자 금지" required></label>`
          : `<label class="f">질문<textarea id="qt" maxlength="120" placeholder="예: 이 중에 지난 MT 때 제일 먼저 잠든 사람은?" required></textarea></label>`}
        <button class="btn primary" type="submit">추가하기</button>
      </form>
      <div class="panel"><h3>추가한 질문 ${customQs.length}개</h3>
        <div class="list">${customQs.length ? customQs.map((q, i) => `
          <div class="item"><div class="txt"><b>${esc(DECKS[q.deck].name)}</b>${q.deck === "balance" ? esc(q.a) + " vs " + esc(q.b) : esc(q.text)}</div>
          <button class="x" data-i="${i}" aria-label="삭제">✕</button></div>`).join("") : `<div class="empty">아직 없어요. 친구들끼리만 아는 질문을 넣어 보세요.</div>`}
        </div></div>`;
    document.getElementById("back").onclick = cardsView;
    document.getElementById("deckSel").onchange = e => { deck = e.target.value; draw(); };
    document.getElementById("f").onsubmit = e => {
      e.preventDefault();
      if (deck === "balance") {
        const a = document.getElementById("qa").value.trim(), b = document.getElementById("qb").value.trim();
        if (!a || !b) return; customQs.push({ deck, a, b });
      } else {
        const t = document.getElementById("qt").value.trim(); if (!t) return; customQs.push({ deck, text: t });
      }
      store.set("hp_customQs", customQs); toast("질문을 추가했어요"); draw();
    };
    $app.querySelectorAll(".x").forEach(b => b.onclick = () => { if (!confirm("이 질문을 삭제할까요?")) return; customQs.splice(+b.dataset.i, 1); store.set("hp_customQs", customQs); draw(); });
  };
  draw();
}

/* ---------- person quiz ---------- */
let quiz = { source: "famous", seconds: 20, count: 20, cats: new Set(Object.keys(CATS)), list: [], idx: 0, shown: 1, revealed: false, left: 0, right: 0, missed: 0 };
function quizSetup() {
  stopTimer(); enterSub();
  const famous = quiz.source === "famous";
  const pool = FAMOUS.filter(f => quiz.cats.has(f[0])).length;
  $app.innerHTML = `
    <div class="bar"><button class="back" id="back" aria-label="처음으로">←</button><h2>인물 퀴즈</h2></div>

    </div>
    ${famous ? `<div class="panel">
      <h3>분야</h3>
      <p>고른 분야에서 섞어서 나와요. 지금 ${pool}명 중에서 나와요.</p>
      <div class="chips">
        <button class="chip" id="allCats" aria-pressed="${quiz.cats.size === Object.keys(CATS).length}">전체</button>
        ${Object.entries(CATS).map(([k, n]) => `<button class="chip" data-cat="${k}" aria-pressed="${quiz.cats.has(k)}">${n} ${FAMOUS.filter(f => f[0] === k).length}</button>`).join("")}
      </div>
      <h3>문제 수</h3>
      <div class="seg">${[10, 20, 0].map(n => `<button data-cnt="${n}" aria-pressed="${quiz.count === n}">${n ? n + "문제" : "전부"}</button>`).join("")}</div>
    </div>` : ""}
    <div class="panel">
      <h3>제한 시간</h3>
      <div class="seg">${[10, 20, 30].map(s => `<button data-sec="${s}" aria-pressed="${quiz.seconds === s}">${s}초</button>`).join("")}</div>
    </div>
    <button class="btn primary" id="start">시작하기</button>
    <button class="btn ghost small" id="edit">+ 친구 사진으로 문제 만들기</button>`;
  document.getElementById("back").onclick = home;
  $app.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { quiz.source = b.dataset.src; quizSetup(); });
  $app.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { quiz.seconds = +b.dataset.sec; quizSetup(); });
  $app.querySelectorAll("[data-cnt]").forEach(b => b.onclick = () => { quiz.count = +b.dataset.cnt; quizSetup(); });
  $app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    const k = b.dataset.cat;
    if (quiz.cats.size === Object.keys(CATS).length) quiz.cats = new Set([k]);
    else if (quiz.cats.has(k)) { if (quiz.cats.size === 1) { toast("최소 한 분야는 골라야 해요"); return; } quiz.cats.delete(k); }
    else quiz.cats.add(k);
    quizSetup();
  });
  const all = document.getElementById("allCats");
  if (all) all.onclick = () => { quiz.cats = new Set(Object.keys(CATS)); quizSetup(); };
  document.getElementById("edit").onclick = peopleView;
  document.getElementById("start").onclick = () => {
    let src;
    if (famous) {
      src = shuffle(FAMOUS.filter(f => quiz.cats.has(f[0])).map(([cat, name, hints]) => ({ cat, name, hints })));
      if (quiz.count) src = src.slice(0, quiz.count);
    } else src = shuffle(customPeople);
    if (!src.length) { toast("먼저 친구 문제를 만들어 주세요"); peopleView(); return; }
    quiz.list = src; quiz.idx = 0; quiz.right = 0; quiz.missed = 0;
    quizRound();
  };
}
function quizRound() {
  stopTimer();
  quiz.shown = 1; quiz.revealed = false; quiz.left = quiz.seconds;
  const p = quiz.list[quiz.idx];
  const hints = (p.hints || []).filter(Boolean);
  const hasPhoto = !!p.photo;
  const totalSteps = hasPhoto ? 4 : 1;
  const R = 26, C = 2 * Math.PI * R;
  $app.innerHTML = `
    <div class="bar"><button class="back" id="back" aria-label="설정으로">←</button><h2>인물 퀴즈</h2><span class="pill">${quiz.idx + 1} / ${quiz.list.length}</span></div>
    <div class="quizbox">
      <div class="quizhead">
        <span class="tag">${p.cat ? esc(CATS[p.cat]) + " · " : ""}누구일까요?</span>
        <div class="timer" id="timer"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" fill="none" stroke="#d6cfb8" stroke-width="6"/><circle id="ring" cx="32" cy="32" r="${R}" fill="none" style="stroke:var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="t" id="tnum">${quiz.left}</div></div>
      </div>
      ${hasPhoto ? `<div class="photo"><img id="pimg" src="${p.photo}" alt="퀴즈 사진"></div>` : ""}
      <ul class="hints" id="hints"></ul>
      <div id="ans" aria-live="polite"></div>
    </div>
    <div id="ctrl"></div>`;
  document.getElementById("back").onclick = quizSetup;
  const draw = () => {
    const step = Math.min(quiz.shown, totalSteps || 1);
    if (hasPhoto) {
      const img = document.getElementById("pimg");
      const k = quiz.revealed ? 1 : step / (totalSteps + 1);
      img.style.filter = quiz.revealed ? "none" : `blur(${Math.round(28 * (1 - k))}px) grayscale(${1 - k})`;
      img.style.transform = quiz.revealed ? "none" : `scale(${(1.9 - k * .7).toFixed(2)})`;
    }
    document.getElementById("hints").innerHTML = hints.map((h, i) => `<li><span>${i + 1}</span>${esc(h)}</li>`).join("");
    const more = quiz.shown < totalSteps && !quiz.revealed;
    document.getElementById("ctrl").innerHTML = quiz.revealed
      ? `<div class="row"><button class="btn mint" id="ok">맞혔어요</button><button class="btn" id="miss">아무도 못 맞힘</button></div>`
      : `<div class="row">${hasPhoto ? `<button class="btn" id="more" ${more ? "" : "disabled"}>더 선명하게</button>` : ""}<button class="btn primary" id="reveal">정답 보기</button></div>`;
    if (quiz.revealed) {
      document.getElementById("ok").onclick = () => { quiz.right++; nextQ(); };
      document.getElementById("miss").onclick = () => { quiz.missed++; nextQ(); };
    } else {
      const mb = document.getElementById("more");
      if (mb) mb.onclick = () => { quiz.shown++; buzz(15); draw(); };
      document.getElementById("reveal").onclick = reveal;
    }
  };
  const reveal = (timeout) => {
    stopTimer(); quiz.revealed = true; buzz([60, 40, 60]);
    document.getElementById("ans").innerHTML = `<div class="answer"><small>${timeout === true ? "시간 끝! 정답은" : "정답은"}</small><strong>${esc(p.name)}</strong></div>
      <div class="penalty">${timeout === true ? "아무도 못 맞혔다면 다 같이 한 잔 🍶" : "먼저 맞힌 사람 빼고 모두 한 잔 🍶"}</div>`;
    draw();
  };
  draw();
  const ring = document.getElementById("ring");
  timerId = setInterval(() => {
    quiz.left--;
    document.getElementById("tnum").textContent = Math.max(quiz.left, 0);
    ring.style.strokeDashoffset = (C * (1 - quiz.left / quiz.seconds)).toFixed(1);
    document.getElementById("timer").classList.toggle("hurry", quiz.left <= 5);
    // auto-open the next hint as time passes
    const due = Math.min(totalSteps, 1 + Math.floor((quiz.seconds - quiz.left) / (quiz.seconds / Math.max(totalSteps, 1))));
    if (due > quiz.shown) { quiz.shown = due; draw(); }
    if (quiz.left <= 0) reveal(true);
  }, 1000);
}
function nextQ() {
  quiz.idx++;
  if (quiz.idx >= quiz.list.length) {
    stopTimer();
    $app.innerHTML = `
      <div class="bar"><button class="back" id="back" aria-label="처음으로">←</button><h2>인물 퀴즈 끝</h2></div>
      <div class="quizbox" style="justify-content:center;text-align:center">
        <div class="answer"><small>맞힌 문제</small><strong>${quiz.right} / ${quiz.list.length}</strong></div>
        <div class="penalty">${quiz.missed ? `못 맞힌 문제 ${quiz.missed}개 · 모두 ${quiz.missed}잔 원샷?` : "하나도 안 놓쳤어요! 다 같이 건배 🥂"}</div>
      </div>
      <button class="btn primary" id="again">다시 하기</button>`;
    document.getElementById("back").onclick = home;
    document.getElementById("again").onclick = quizSetup;
    return;
  }
  quizRound();
}

/* ---------- custom people editor ---------- */
function resizeImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const S = 480, s = Math.min(1, S / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", .78));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function peopleView() {
  stopTimer(); enterSub();
  let photo = null;
  $app.innerHTML = `
    <div class="bar"><button class="back" id="back" aria-label="퀴즈 설정으로">←</button><h2>우리끼리 인물 퀴즈</h2></div>
    <form class="panel" id="f">
      <p>친구 어릴 적 사진, 확대한 얼굴 사진을 넣으면 재밌어요. 사진은 이 기기 브라우저에만 저장돼요.</p>
      <label class="upload" for="ph"><input type="file" id="ph" accept="image/*"><span id="phPrev">📷</span><span id="phTxt">사진 고르기 (선택)</span></label>
      <label class="f">정답 (이름)<input type="text" id="nm" maxlength="30" placeholder="예: 민수" required></label>
      <label class="f">키워드 1<input type="text" id="h1" maxlength="60" placeholder="예: 우리 중에 제일 늦게 오는 사람"></label>
      <label class="f">키워드 2<input type="text" id="h2" maxlength="60" placeholder="예: MBTI가 ENFP"></label>
      <label class="f">키워드 3<input type="text" id="h3" maxlength="60" placeholder="예: 지난주에 머리 자름"></label>
      <button class="btn primary" type="submit">문제 추가</button>
    </form>
    <div class="panel"><h3>만든 문제 ${customPeople.length}개</h3>
      <div class="list">${customPeople.length ? customPeople.map((p, i) => `
        <div class="item">${p.photo ? `<img src="${p.photo}" alt="">` : ""}<div class="txt"><b>${esc(p.name)}</b>${esc((p.hints || []).filter(Boolean).join(" · ") || "힌트 없음")}</div>
        <button class="x" data-i="${i}" aria-label="삭제">✕</button></div>`).join("") : `<div class="empty">아직 없어요. 위에서 첫 문제를 만들어 보세요.</div>`}
      </div>
      ${customPeople.length ? `<button class="btn mint" id="play">이 문제로 시작</button>` : ""}
    </div>`;
  document.getElementById("back").onclick = quizSetup;
  document.getElementById("ph").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      photo = await resizeImage(f);
      document.getElementById("phPrev").innerHTML = `<img src="${photo}" alt="고른 사진">`;
      document.getElementById("phTxt").textContent = "사진 바꾸기";
    } catch (err) { toast("이 사진은 열 수 없어요. 다른 사진을 골라 주세요"); }
  };
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById("nm").value.trim(); if (!name) return;
    const hints = ["h1", "h2", "h3"].map(id => document.getElementById(id).value.trim()).filter(Boolean);
    if (!photo && !hints.length) { toast("사진이나 힌트를 하나 이상 넣어 주세요"); return; }
    customPeople.push({ name, hints, photo });
    if (!store.set("hp_people", customPeople)) toast("저장 공간이 부족해 새로고침하면 사라질 수 있어요");
    else toast(`'${name}' 문제를 추가했어요`);
    peopleView();
  };
  $app.querySelectorAll(".x").forEach(b => b.onclick = () => { if (!confirm("이 문제를 삭제할까요?")) return; customPeople.splice(+b.dataset.i, 1); store.set("hp_people", customPeople); peopleView(); });
  const play = document.getElementById("play");
  if (play) play.onclick = () => { quiz.source = "custom"; quiz.list = shuffle(customPeople); quiz.idx = 0; quiz.right = 0; quiz.missed = 0; quizRound(); };
}

home();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
